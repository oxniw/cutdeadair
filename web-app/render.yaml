# ==============================================================================
# Render Blueprint Specification
# Deploys CutDeadAir containerized web application on Render Web Service
# ==============================================================================
services:
  - type: web
    name: cutdeadair
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
