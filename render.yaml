# ==============================================================================
# Root Render Blueprint Specification
# Deploys CutDeadAir containerized web application from repository root
# ==============================================================================
services:
  - type: web
    name: cutdeadair
    runtime: docker
    dockerfilePath: ./web-app/Dockerfile
    dockerContext: ./web-app
    plan: free
    region: oregon
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
